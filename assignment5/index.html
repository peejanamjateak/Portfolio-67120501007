<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Blogger Forum</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <div class="forum-container">
        <!-- Header -->
        <h1 id="top"></h1>
        
        <!-- Post Display Areas -->
        <div class="posts-wrapper">
            <div class="post-box topic-box">
                <span class="box-label">Topic</span>
                <div id="topic"></div>
            </div>
            <div class="post-box reply-box">
                <span class="box-label">Reply #1</span>
                <div id="reply1"></div>
            </div>
            <div class="post-box reply-box">
                <span class="box-label">Reply #2</span>
                <div id="reply2"></div>
            </div>
        </div>

        <hr class="divider">

        <!-- Input & Action Controls -->
        <div class="control-panel">
            <label for="message">พิมพ์ข้อความของคุณ:</label>
            <textarea name="message" id="message" rows="4" placeholder="พิมพ์ข้อความที่ต้องการแชร์ตรงนี้..."></textarea> 
            <div class="button-group">
                <button type="button" id="postButton" class="btn btn-primary">Post</button>
                <button type="button" id="clearButton" class="btn btn-secondary">Clear</button>
            </div>
        </div>
    </div>
</body>
</html>
