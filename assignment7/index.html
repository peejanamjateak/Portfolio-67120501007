<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Square Game</title>
        
        <!-- เชื่อมต่อไฟล์ External CSS & JS -->
        <link rel="stylesheet" type="text/css" href="game.css">
        <script type="text/javascript" src="game.js"></script>
    </head>
    <body>
        <!-- แถบนำทางกลับไปยังหน้า Portfolio หลัก -->
        <header class="top-nav">
            <a href="../../index.html" class="back-link">&larr; Back to Portfolio</a>
        </header>

        <main>
            <!-- Control Panel -->
            <fieldset>
                <legend>Control</legend>
                <div class="control-group">
                    <label for="numbox">Number of box:</label>
                    <input type="number" name="numbox" id="numbox" min="1" max="100" placeholder="e.g. 10">
                </div>

                <div class="control-group">
                    <label for="color">Color:</label>
                    <select name="color" id="color">
                        <option value="maroon">Maroon</option>
                        <option value="lightgreen">Lightgreen</option>
                        <option value="magenta">Magenta</option>
                    </select>
                </div>

                <button id="start" type="button">Start</button>

                <div id="timerClock">
                    Timer: <span id="clock">0</span>
                </div>
            </fieldset>

            <!-- พื้นที่สำหรับแสดงกล่องสี่เหลี่ยมในเกม -->
            <div id="container">
                <div id="layer"></div>
            </div>
        </main>

        <!-- แหล่งอ้างอิง Reference เพื่อไม่ให้ถูกหักคะแนน -->
        <footer>
            <p>
                Adapted from: 
                <a href="https://courses.cs.washington.edu/courses/cse154/17sp/lecture/more-dom/code/squares.html" target="_blank" rel="noopener noreferrer">
                    CSE154 Squares Example
                </a>
            </p>
        </footer>
    </body>
</html>
